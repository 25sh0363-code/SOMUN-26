<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOMUN '26 — code handoff</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root { --bg:#161210; --panel:#1e1815; --line:rgba(236,225,203,.16); --beige:#ece1cb; --dim:#b3a487; --red:#c8102e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--beige); font:14px/1.5 "Sarasa Mono SC", Consolas, Menlo, monospace; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  header h1 { font-size:14px; letter-spacing:.14em; text-transform:uppercase; margin:0; color:var(--dim); font-weight:normal; }
  header a { color:var(--beige); text-decoration:none; border:1px solid var(--line); padding:6px 12px; }
  header a:hover { border-color:rgba(236,225,203,.4); }
  main { display:flex; min-height:calc(100vh - 55px); }
  nav { width:230px; border-right:1px solid var(--line); padding:12px 0; flex-shrink:0; }
  nav button { display:block; width:100%; text-align:left; background:none; border:none; color:var(--dim); padding:9px 18px; cursor:pointer; font:inherit; }
  nav button:hover { color:var(--beige); }
  nav button.on { color:var(--beige); border-left:3px solid var(--red); padding-left:15px; background:rgba(200,16,46,.07); }
  nav .grp { padding:12px 18px 4px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); opacity:.7; }
  .stage { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .bar .name { color:var(--beige); }
  .bar .meta { color:var(--dim); font-size:12px; }
  .bar button { background:var(--red); border:none; color:#fff; padding:8px 16px; cursor:pointer; font:inherit; letter-spacing:.06em; }
  .bar button.ok { background:#1d7a3a; }
  .bar a { color:var(--dim); }
  pre { margin:0; padding:16px; overflow:auto; flex:1; white-space:pre; tab-size:2; }
  @media (max-width:720px){ nav { width:150px; } pre { padding:10px; } }
</style>
</head>
<body>
<header>
  <h1>SOMUN '26 · code handoff (r39)</h1>
  <a href="/" target="_blank" rel="noopener">open the live site ↗</a>
</header>
<main>
  <nav id="files"></nav>
  <div class="stage">
    <div class="bar">
      <span class="name" id="name">—</span>
      <span class="meta" id="meta"></span>
      <button id="copy">Copy file</button>
      <a id="raw" href="#" target="_blank" rel="noopener">raw ↗</a>
    </div>
    <pre id="view">Loading…</pre>
  </div>
</main>
<script>
const FILES = [
  { grp: "site" },
  { p: "js/main.js", note: "← the r39 QR pay fix lives here" },
  { p: "js/config.js" },
  { p: "js/data.js" },
  { p: "js/icons.js" },
  { p: "js/confetti.js" },
  { p: "index.html" },
  { p: "css/styles.css" },
  { grp: "backend (supabase/)" },
  { p: "supabase/payment.sql" },
  { p: "supabase/fix-view-payment.sql" },
  { p: "supabase/ai-shot-check.sql", note: "← the AI screenshot desk (Gemini) lives here" },
  { p: "supabase/search-reject-mail.sql", note: "← console search + rejection mails live here" },
  { p: "supabase/mailer-hook.sql", note: "← upgrade: now also carries the rejection reason" },
  { p: "supabase/apps-script/Code.gs" },
  { p: "supabase/PAYMENTS.md" },
  { p: "supabase/MAIL-SETUP.md" },
];
const nav = document.getElementById("files");
const view = document.getElementById("view");
const nameEl = document.getElementById("name");
const metaEl = document.getElementById("meta");
const rawEl = document.getElementById("raw");
const copyBtn = document.getElementById("copy");
let current = null, currentText = "";

FILES.forEach((f) => {
  if (f.grp) {
    const g = document.createElement("div");
    g.className = "grp"; g.textContent = f.grp;
    nav.append(g);
    return;
  }
  const b = document.createElement("button");
  b.textContent = f.p;
  b.title = f.note || f.p;
  b.addEventListener("click", () => load(f.p, b));
  nav.append(b);
  if (f.p === "js/main.js") setTimeout(() => b.click());
});

async function load(p, btn) {
  [...nav.querySelectorAll("button")].forEach((b) => b.classList.toggle("on", b === btn));
  current = p;
  nameEl.textContent = p;
  rawEl.href = "/" + p;
  view.textContent = "Loading…";
  try {
    const r = await fetch("/" + p, { cache: "no-store" });
    currentText = await r.text();
    view.textContent = currentText;
    const lines = currentText.split("\n").length;
    metaEl.textContent = `${lines} lines · ${(currentText.length / 1024).toFixed(1)} KB${(btn && btn.title && btn.title.includes("←")) ? " · " + btn.title.replace("← ", "") : ""}`;
  } catch (e) {
    view.textContent = "Could not load " + p;
  }
}

copyBtn.addEventListener("click", async () => {
  if (!currentText) return;
  let ok = false;
  try { await navigator.clipboard.writeText(currentText); ok = true; }
  catch {
    const ta = document.createElement("textarea");
    ta.value = currentText;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.append(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
  }
  copyBtn.textContent = ok ? "Copied ✓" : "Select-all manually";
  copyBtn.classList.toggle("ok", ok);
  setTimeout(() => { copyBtn.textContent = "Copy file"; copyBtn.classList.remove("ok"); }, 2000);
  if (!ok) { const r = document.createRange(); r.selectNodeContents(view); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
});
</script>
</body>
</html>
